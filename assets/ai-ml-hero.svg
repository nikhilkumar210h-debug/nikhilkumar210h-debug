    <text x="74" y="239" font-size="21" font-weight="600" fill="#E8F2FF">From mathematical foundations to intelligent systems.</text>
    <text x="74" y="277" font-size="15" fill="#A8B8D3">Python  /  Data Science  /  Machine Learning  /  Generative AI</text>
