      <rect x="112" width="102" height="29" rx="14.5" fill="#19243C" stroke="#55B8FA" stroke-opacity=".55"/><text x="163" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#C7E9FF">BUILD</text>
      <rect x="224" width="102" height="29" rx="14.5" fill="#251D40" stroke="#A78BFA" stroke-opacity=".6"/><text x="275" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#E1D5FF">EVALUATE</text>
