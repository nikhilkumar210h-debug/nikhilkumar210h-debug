<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Nikhil Kumar — AI and Machine Learning</title>
  <desc id="desc">A premium dark navy banner with cyan and violet gradients, subtle grid lines and a neural network illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D1B"/><stop offset="0.55" stop-color="#101A34"/><stop offset="1" stop-color="#17102B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43E5D3"/><stop offset="0.52" stop-color="#4CB8FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#DDF7FF"/><stop offset="1" stop-color="#B8B5FF"/></linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#00D9FF" stop-opacity=".24"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8FB7D5" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="26" fill="url(#grid)"/>
  <ellipse cx="180" cy="50" rx="360" ry="220" fill="url(#glowA)"/>
  <ellipse cx="1060" cy="320" rx="320" ry="250" fill="url(#glowB)"/>
  <path d="M0 322 C220 286 360 370 590 326 S970 268 1200 316" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="1.5"/>
