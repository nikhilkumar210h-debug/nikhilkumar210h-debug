name: Generate contribution snake

on:
  # Refresh the contribution animation every day.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual regeneration from the Actions tab.
  workflow_dispatch:

  # Generate it after profile README or workflow changes land on main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    name: Generate and publish snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nikhilkumar210h-debug
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2355DDF5

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
